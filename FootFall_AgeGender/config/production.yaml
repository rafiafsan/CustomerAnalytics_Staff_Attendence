# Production Configuration for Retail AI Analytics System
# Specially optimized for Windows Mini PC (2 GB usable RAM, 4 CPU Cores, No GPU)

mode: "production"

camera:
  config_file: "config/camera.yaml"
  rtsp_url: "rtsp://ctrl:ctl%40123456@10.1.56.11:554/Streaming/Channels/1201"
  fallback_video: "test_videos/Outlet_Sample_2_Banasree.avi"
  width: 1280
  height: 720
  target_fps: 15
  buffer_size: 1

inference:
  enabled: true
  target_fps: 15
  width: 640
  height: 360
  model: "models/yolov8m.onnx"
  fallback_model: "models/yolov8m_int8.onnx"
  high_accuracy_model: "models/yolov8m.pt"
  backend: "onnx"  # "onnx" or "torch"
  prefer_openvino: true
  device: "GPU"  # "GPU" (Intel Iris Xe iGPU) or "CPU"
  cpu_threads: 2
  confidence: 0.40

tracking:
  tracker: "bytetrack"
  trail_length: 30

gates:
  config_file: "config/gates.json"
  deadband_pixels: 15
  min_entry_dwell_seconds: 60
  min_exit_dwell_seconds: 90
  min_dwell_seconds: 60

bag_detection:
  enabled: true
  event_driven: true
  min_consecutive_frames: 1
  max_bag_distance: 240
  min_iob: 0.03
  association_threshold: 0.30
  min_exit_frames: 1
  movement_threshold: 10

demographics:
  enabled: true
  mode: "cpu"
  checkpoint: "mivolo_system/model/model_imdb_cross_person_4.22_99.46.pth.tar"
  detector_weights: "mivolo_system/model/yolov8x_person_face.pt"
  max_samples: 4
  queue_size: 4
  cpu_threads: 1
  female_threshold: 0.33

api:
  enabled: true
  base_url: "http://ai.prangroup.com:8021"
  api_key: "secret_outlet_token_banasree"  # set the API_KEY environment variable (never commit the real token)
  occupancy_interval_minutes: 20.0
  metrics_sync_interval_seconds: 5.0

shop:
  shop_id: 3
  camera_id: "cam_01"

safeguards:
  ram_limit_mb: 3500
  cpu_limit_percent: 90
  ram_restart_mb: 2400  # headless: exit so the supervisor restarts if RSS exceeds this
